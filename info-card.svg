<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    width="520"
    height="300"
    viewBox="0 0 520 300"
    role="img"
    aria-label="Developer information card"
>

<title>Ronak Raj - Developer Profile</title>

<rect
    width="100%"
    height="100%"
    rx="12"
    fill="#161b22"
    stroke="#30363d"
    stroke-width="1"
/>


    <!-- Terminal title bar -->

    <rect
        x="1"
        y="1"
        width="518"
        height="38"
        rx="11"
        fill="#21262d"
    />

    <rect
        x="1"
        y="27"
        width="518"
        height="12"
        fill="#21262d"
    />

    <circle cx="20" cy="20" r="5" fill="#ff5f56"/>
    <circle cx="38" cy="20" r="5" fill="#ffbd2e"/>
    <circle cx="56" cy="20" r="5" fill="#27c93f"/>

    <text
        x="260.0"
        y="24"
        text-anchor="middle"
        font-family="monospace"
        font-size="11"
        fill="#8b949e"
    >developer@profile ~ </text>
    

    <g transform="translate(24, 65)">

        <!-- Profile name -->

        <text
            x="0"
            y="0"
            font-family="monospace"
            font-size="21"
            font-weight="bold"
            fill="#61afef"
        >Ronak Raj</text>

        <!-- Subtitle -->

        <text
            x="0"
            y="23"
            font-family="monospace"
            font-size="10"
            letter-spacing="2"
            fill="#98c379"
        >AI / ML ENGINEER</text>

        <!-- Separator -->

        <line
            x1="0"
            y1="38"
            x2="470"
            y2="38"
            stroke="#30363d"
            stroke-width="1"
        />

    </g>
    


        <g
            opacity="0"
            transform="translate(0, 10)"
        >

            
            <animate
                attributeName="opacity"
                from="0"
                to="1"
                begin="0.00s"
                dur="0.45s"
                fill="freeze"
            />

            <animateTransform
                attributeName="transform"
                type="translate"
                from="0 10"
                to="0 0"
                begin="0.00s"
                dur="0.45s"
                fill="freeze"
            />
            

            <!-- Label -->

            <text
                x="24"
                y="137"
                font-family="monospace"
                font-size="12"
                font-weight="bold"
                fill="#e5c07b"
            >Now</text>

            <!-- Separator -->

            <text
                x="125"
                y="137"
                font-family="monospace"
                font-size="12"
                fill="#8b949e"
            >:</text>

            <!-- Value -->

            <text
                x="145"
                y="137"
                font-family="monospace"
                font-size="12"
                fill="#c9d1d9"
            >Building AI Agents</text>

        </g>

        


        <g
            opacity="0"
            transform="translate(0, 10)"
        >

            
            <animate
                attributeName="opacity"
                from="0"
                to="1"
                begin="0.16s"
                dur="0.45s"
                fill="freeze"
            />

            <animateTransform
                attributeName="transform"
                type="translate"
                from="0 10"
                to="0 0"
                begin="0.16s"
                dur="0.45s"
                fill="freeze"
            />
            

            <!-- Label -->

            <text
                x="24"
                y="172"
                font-family="monospace"
                font-size="12"
                font-weight="bold"
                fill="#e5c07b"
            >Prev</text>

            <!-- Separator -->

            <text
                x="125"
                y="172"
                font-family="monospace"
                font-size="12"
                fill="#8b949e"
            >:</text>

            <!-- Value -->

            <text
                x="145"
                y="172"
                font-family="monospace"
                font-size="12"
                fill="#c9d1d9"
            >ML Engineering</text>

        </g>

        


        <g
            opacity="0"
            transform="translate(0, 10)"
        >

            
            <animate
                attributeName="opacity"
                from="0"
                to="1"
                begin="0.32s"
                dur="0.45s"
                fill="freeze"
            />

            <animateTransform
                attributeName="transform"
                type="translate"
                from="0 10"
                to="0 0"
                begin="0.32s"
                dur="0.45s"
                fill="freeze"
            />
            

            <!-- Label -->

            <text
                x="24"
                y="207"
                font-family="monospace"
                font-size="12"
                font-weight="bold"
                fill="#e5c07b"
            >Stack</text>

            <!-- Separator -->

            <text
                x="125"
                y="207"
                font-family="monospace"
                font-size="12"
                fill="#8b949e"
            >:</text>

            <!-- Value -->

            <text
                x="145"
                y="207"
                font-family="monospace"
                font-size="12"
                fill="#c9d1d9"
            >Python, PyTorch, RAG, MCP</text>

        </g>

        


        <g
            opacity="0"
            transform="translate(0, 10)"
        >

            
            <animate
                attributeName="opacity"
                from="0"
                to="1"
                begin="0.48s"
                dur="0.45s"
                fill="freeze"
            />

            <animateTransform
                attributeName="transform"
                type="translate"
                from="0 10"
                to="0 0"
                begin="0.48s"
                dur="0.45s"
                fill="freeze"
            />
            

            <!-- Label -->

            <text
                x="24"
                y="242"
                font-family="monospace"
                font-size="12"
                font-weight="bold"
                fill="#e5c07b"
            >Highlights</text>

            <!-- Separator -->

            <text
                x="125"
                y="242"
                font-family="monospace"
                font-size="12"
                fill="#8b949e"
            >:</text>

            <!-- Value -->

            <text
                x="145"
                y="242"
                font-family="monospace"
                font-size="12"
                fill="#c9d1d9"
            >Multi-Agent Systems, CV, Research</text>

        </g>

        


    <line
        x1="24"
        y1="272"
        x2="496"
        y2="272"
        stroke="#30363d"
    />

    <text
        x="24"
        y="290"
        font-family="monospace"
        font-size="10"
        fill="#98c379"
    >● SYSTEM ONLINE</text>

    <text
        x="496"
        y="290"
        text-anchor="end"
        font-family="monospace"
        font-size="10"
        fill="#8b949e"
    >PROFILE.SVG</text>

    
</svg>